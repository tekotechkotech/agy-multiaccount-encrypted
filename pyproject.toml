[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-account-switch"
version = "0.2.0"
description = "Encrypted multi‑account switcher for Antigravity CLI"
authors = [{name = "Tekotechkotech", email = "admin@faizen.biz"}]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = ["keyring>=23.0.0"]

[tool.setuptools]
packages = {find = {where = ["agy_account_switch"]}}

# Editable install support (PEP‑660)
[tool.setuptools.editable]
mode = "editable"
