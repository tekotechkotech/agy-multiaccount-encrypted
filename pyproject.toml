[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "agy_account_switch"
dynamic = ["version", "description"]
authors = [{name = "tekotechkotech", email = "faizen@example.com"}]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "keyring>=23.0.0",
]

[project.scripts]
agy-account = "agy_account_switch.agy_account_cli:main"
